# Shared example project — environment and metadata (Module 02/03).
# Exact versions matter: they are what makes a run reproducible.
[project]
name = "lahore-retail-churn"
version = "0.1.0"
description = "Shared worked example for the MLOps course (synthetic data, CC0)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
tracking = ["mlflow>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"