# LAB-14 starter workflow (Path B scaffold — adapt, then place in
# .github/workflows/lab-14.yml of YOUR repository for Path A).
#
# The rubric checks: triggers · 3 jobs · pinned action versions ·
# permissions: contents: read · artifact upload · no secrets in this file.
#
# NOTE: this file has NOT been executed on GitHub from this repository.
# Run it yourself; label unexecuted claims NOT RUN (lab.md §9–10).

name: lab-14

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lab14-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # least privilege: CI only reads the repo

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.15.1
      - run: python -m ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4        # keep the evidence
        if: always()
        with:
          name: test-report
          path: report.md
          if-no-files-found: ignore

  ml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      # lightweight ML checks: data contract + metric floor (no GPU)
      - run: python -m src.validate
      - run: python check_metrics.py
