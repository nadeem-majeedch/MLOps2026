# =====================================================================
# CI for the shared example project (Module 12 of the MLOps course).
#
#   push / pull request  ->  lint  +  tests  +  lightweight ML validation
#
# Design notes (explained in docs/modules/12-cicd-github-actions/concepts.md):
#   * least privilege: the workflow can read the repo and nothing else
#   * three independent jobs — failures name the layer that broke
#   * no credentials anywhere: nothing here reads a secret, and nothing
#     ever prints one. Secrets belong in GitHub Settings -> Secrets and
#     in `env:`, never in this file and never in source code.
# =====================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the now-useless older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # checkout only; no write access is needed

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examples/churn/requirements-docker.txt
      - name: Install lint tooling
        run: python -m pip install ruff==0.15.1
      - name: Ruff check
        run: ruff check .

  test:
    name: tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examples/churn/requirements-docker.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-docker.txt pytest==9.1.1 pytest-cov==7.1.0
      - name: Generate the synthetic dataset (deterministic)
        run: python generate_data.py
      - name: Run the test suite
        run: python -m pytest --cov=src --cov-report=term-missing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: examples/churn/.coverage
          retention-days: 7

  ml-validate:
    name: ml validation (data contract + quality floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examples/churn/requirements-docker.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-docker.txt
      - name: Generate the synthetic dataset (deterministic)
        run: python generate_data.py
      - name: Train once (cheap, CPU-only, ~1 s)
        run: python -m src.train --config config.yaml --data data/raw/churn.csv
      - name: Validate data contract and quality floor
        run: python ml_check.py
      # Example of where a secret would go (NOT active — no secret exists):
      #   env:
      #     REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
      # Secrets are injected at runtime, masked in logs, and must never be
      # echoed, written to a file, or committed.