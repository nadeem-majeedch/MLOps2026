# =====================================================================
# Course website (MkDocs) — BUILD for everyone, DEPLOY only from main.
#
#   pull request / push  -> build --strict   (validation only)
#   push to main         -> build + upload + deploy-pages
#
# Design notes (docs/reference-guides/github-pages-deployment.md):
#   * permissions: the workflow starts with `contents: read` and only the
#     deploy job is granted `pages: write` + `id-token: write` — least
#     privilege, and no secret or token of any kind is used (Pages uses an
#     OIDC-free but token-scoped deploy action; nothing is echoed).
#   * validation and deployment are separated: pull requests never reach
#     the deploy job, so untrusted PR code can never publish anything.
#   * the deploy job is additionally gated on a push to main AND carries
#     its own `if:` — belt and braces.
#   * repository Pages settings are NOT assumed: `configure-pages` runs
#     with `continue-on-error` (MkDocs gets its base path from `site_url`,
#     not from this action's outputs), so the BUILD stays green before the
#     owner has chosen Settings -> Pages -> Source: GitHub Actions. The
#     deploy job still fails loudly until that setting exists — that is
#     the intended signal, documented in
#     docs/reference-guides/github-pages-deployment.md §4.
#   * action versions are current majors as of writing: checkout@v7,
#     setup-python@v7, configure-pages@v5, upload-pages-artifact@v4,
#     deploy-pages@v4. Do not downgrade them without a reason.
#   * NEVER replace the deploy job with `mkdocs gh-deploy` — it performs
#     git operations and would push built files from CI.
# =====================================================================

name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The deploy path must never be cancelled mid-flight; PR builds may be.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read          # checkout only; nothing else, at the top level

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      # The gate: warnings fail the build on purpose.
      - name: Build the static site
        run: python -m mkdocs build --strict

      # Everything below only runs for a push to main — pull requests are
      # pure validation and never touch Pages.
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true     # see header note: site_url is enough for MkDocs
        uses: actions/configure-pages@v5

      - name: Upload the built site as the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write         # publish the artifact
      id-token: write      # OIDC identity for the deploy action
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4