# MkDocs configuration for the MLOps course website.
# Source Markdown lives in docs/; build output goes to site/ (excluded from Git).
# See docs/reference-guides/website-development.md before editing.

site_name: MLOps — A Self-Study Course
site_description: >-
  A complete beginner-to-advanced, self-study Machine Learning Operations (MLOps)
  course for university students: 17 modules, guided labs, mini-projects, capstone.
site_author: Engr. Dr. Muhammad Nadeem Majeed
site_url: https://nadeem-majeedch.github.io/MLOps/

repo_url: https://github.com/nadeem-majeedch/MLOps
repo_name: nadeem-majeedch/MLOps
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.footer      # previous / next page links
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nadeem-majeedch/MLOps
      name: MLOps repository on GitHub

